server.port=8080

# RABBITMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2

# MONGODB ATLAS (Production Cluster)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# MAIL (Ethereal)
spring.mail.host=${SMTP_HOST:smtp.ethereal.email}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT
jwt.secret=${JWT_SECRET:development-secret-key-min-32-chars-here-for-security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CLOUDINARY
cloudinary.url=${CLOUDINARY_URL:}

# LOGGING
logging.file.name=logs/cine-app-back-mongo.log
logging.level.root=${LOGGING_LEVEL_ROOT:DEBUG}
logging.level.co.com.cineapp.backmongo=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.amqp=INFO

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Tomcat Access Logs
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log

# SLA (Service Level Agreement)
parent.gateway.async.timeout=10000
parent.gateway.retry.maxAttempts=3
parent.gateway.retry.delay=1000

spring.cloud.vault.enabled=false